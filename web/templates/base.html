<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftBell Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f0f23; color: #cdd6f4; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: #1e1e2e !important; border-bottom: 1px solid #313244; }
    .navbar-brand { color: #cba6f7 !important; font-weight: 700; font-size: 1.4rem; }
    .card { background: #1e1e2e; border: 1px solid #313244; border-radius: 12px; }
    .card-header { background: #181825; border-bottom: 1px solid #313244; font-weight: 600; color: #89b4fa; }
    .card-body { background: #1e1e2e; }
    .btn-primary { background: #89b4fa; border: none; color: #111; font-weight: 600; }
    .btn-primary:hover { background: #74c7ec; }
    .btn-success { background: #a6e3a1; border: none; color: #111; font-weight: 600; }
    .btn-success:hover { background: #94e2d5; }
    .btn-danger { background: #f38ba8; border: none; color: #111; font-weight: 700; }
    .btn-danger:hover { background: #eba0ac; }
    .btn-warning { background: #f9e2af; border: none; color: #111; font-weight: 600; }
    .table { color: #cdd6f4; }
    .table thead { color: #a6adc8; }
    .badge-running { background: #a6e3a1; color: #111; }
    .badge-stopped { background: #f38ba8; color: #111; }
    .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    .status-dot.running { background: #a6e3a1; }
    .status-dot.stopped { background: #f38ba8; }
    footer { color: #585b70; text-align: center; padding: 2rem 0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">SwiftBell</a>
      <span class="text-secondary ms-2">School Bell &amp; Announcement System</span>
    </div>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <footer>
    <div class="container">SwiftBell &mdash; Automated School Bell System</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function api(action) {
      fetch('/api/' + action, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          if (data.status === 'started' || data.status === 'stopped' || data.status === 'already_running') {
            location.reload();
          }
        })
        .catch(() => {});
    }

    setInterval(function() {
      fetch('/api/status')
        .then(r => r.json())
        .then(data => {
          const dot = document.getElementById('status-dot');
          const label = document.getElementById('status-label');
          if (data.running) {
            dot.className = 'status-dot running';
            label.textContent = 'Running';
            label.className = 'badge badge-running';
          } else {
            dot.className = 'status-dot stopped';
            label.textContent = 'Stopped';
            label.className = 'badge badge-stopped';
          }
        })
        .catch(() => {});
    }, 3000);
  </script>
</body>
</html>
